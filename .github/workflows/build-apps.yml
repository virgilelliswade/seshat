name: Build & Release Seshat Multiplatform Apps

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Seshat-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  build-macos:
    name: Build macOS DMG & App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build macOS Distributable & DMG
        run: ./gradlew :composeApp:packageDmg :composeApp:createDistributable --stacktrace

      - name: Upload macOS DMG Installer
        uses: actions/upload-artifact@v4
        with:
          name: Seshat-macOS-DMG
          path: composeApp/build/compose/binaries/main/dmg/*.dmg
          retention-days: 14

      - name: Upload macOS Application Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Seshat-macOS-App
          path: composeApp/build/compose/binaries/main/app/
          retention-days: 14
